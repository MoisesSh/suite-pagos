# RabbitMQ 4.x remueve por default la feature transient_nonexcl_queues (colas
# transitorias exclusivas), usada internamente por bibliotecas cliente de
# Celery/Kombu para su mecanismo de eventos (celeryev) — no solo Flower, es
# el mismo tipo de declaracion que ya afecto al pidbox y a gossip/mingle del
# worker (ver PLAN-DE-MEJORAS.md, Bloque #14). Ahi se pudo evitar con flags de
# arranque del worker (--without-gossip/--without-mingle), pero Flower declara
# esa cola de forma interna sin flag equivalente para desactivarlo — se
# reactiva la feature deprecada a nivel de broker, unica forma de que Flower
# muestre datos sin parchear su codigo.
deprecated_features.permit.transient_nonexcl_queues = true

# Mismo motivo: Kombu/Flower tambien usan basic_qos con global=True (prefetch
# compartido entre consumidores del mismo canal), otra feature que RabbitMQ 4.x
# desactiva por default.
deprecated_features.permit.global_qos = true

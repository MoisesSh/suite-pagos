# Orquestacion de los 4 servicios del monorepo. Ejecutar desde la raiz:
#   docker compose -f deploy/docker-compose.yml up -d
#
# Decisiones de arquitectura respetadas (ver ORCHESTRATION-STATUS.md e
# investigaciones/*.md — no cambiar sin revisar la justificacion):
#   - Dos bases PostgreSQL COMPLETAMENTE SEPARADAS (database-per-service),
#     nunca un solo Postgres con dos schemas (investigaciones/research-schemas-vs-bases-separadas.md).
#   - RabbitMQ como unico broker de eventos, SIN Redis (investigaciones/research-rabbitmq-vs-redis.md).
#     Redis no aparece en este compose — no agregarlo sin una necesidad real
#     (cache/locks/rate-limiting), y nunca como broker ni result backend de Celery.
#   - Solo suit-conciliacion tiene worker Celery (consume pago.* de RabbitMQ).
#     suit-orquestador no tiene worker propio: su relay outbox->RabbitMQ es un
#     poller via Celery beat corriendo dentro del propio proceso backend.

services:
  postgres-orquestador:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORQUESTADOR_DB_NAME:-orquestador_pagos}
      POSTGRES_USER: ${ORQUESTADOR_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORQUESTADOR_DB_PASSWORD}
    volumes:
      - postgres_orquestador_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # solo dev/staging — para conectar con un cliente SQL (DBeaver, etc.) desde el host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORQUESTADOR_DB_USER:-postgres}"]
      interval: 10s
      retries: 5

  postgres-conciliacion:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CONCILIACION_DB_NAME:-conciliacion_pagos}
      POSTGRES_USER: ${CONCILIACION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CONCILIACION_DB_PASSWORD}
    volumes:
      - postgres_conciliacion_data:/var/lib/postgresql/data
    ports:
      - "5434:5432" # solo dev/staging — para conectar con un cliente SQL (DBeaver, etc.) desde el host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONCILIACION_DB_USER:-postgres}"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/99-suit-pagos.conf:ro
    ports:
      - "15672:15672" # management UI, solo dev/staging
      - "5672:5672" # AMQP, solo dev/staging — para probar el consumer Celery desde el host
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 5

  suit-orquestador:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE_DIR: suit-orquestador
      target: runner
    restart: unless-stopped
    depends_on:
      postgres-orquestador:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: ../suit-orquestador/.env
    environment:
      DB_HOST: postgres-orquestador
      DB_NAME: ${ORQUESTADOR_DB_NAME:-orquestador_pagos}
      DB_USER: ${ORQUESTADOR_DB_USER:-postgres}
      DB_PASSWORD: ${ORQUESTADOR_DB_PASSWORD}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      ALLOWED_HOSTS: suit-orquestador,localhost,127.0.0.1
    ports:
      - "8001:8000"

  suit-conciliacion:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        SERVICE_DIR: suit-conciliacion
      target: runner
    restart: unless-stopped
    depends_on:
      postgres-conciliacion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: ../suit-conciliacion/.env
    environment:
      DATABASE_URL: postgres://${CONCILIACION_DB_USER:-postgres}:${CONCILIACION_DB_PASSWORD}@postgres-conciliacion:5432/${CONCILIACION_DB_NAME:-conciliacion_pagos}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      ALLOWED_HOSTS: suit-conciliacion,localhost,127.0.0.1
      # Origen del Developer Portal (suit-portal) autorizado a embeber
      # /api/docs/ y /api/schema/ por iframe — ver config/urls.py.
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:3001}
      # Auditoría de seguridad (Bloque #16): DEBUG ahora es False por default
      # en el código — este stack de dev/staging lo pide explícito para
      # mantener /api/docs/ expuesto. CORS_ALLOWED_ORIGINS ya no se activa
      # solo (fail-open eliminado) — se declara explícito para los dos
      # consumidores de navegador conocidos hoy (frontend + portal).
      DEBUG: ${DEBUG:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8002:8000"

  suit-conciliacion-celery-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.celery-worker
    restart: unless-stopped
    depends_on:
      postgres-conciliacion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file: ../suit-conciliacion/.env
    environment:
      DATABASE_URL: postgres://${CONCILIACION_DB_USER:-postgres}:${CONCILIACION_DB_PASSWORD}@postgres-conciliacion:5432/${CONCILIACION_DB_NAME:-conciliacion_pagos}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      FLOWER_PORT: 5555
      FLOWER_UNAUTHENTICATED_API: "true" # el propio dashboard (JS del navegador) llama a /api/*; sin esto Flower bloquea esas llamadas y la UI queda vacia. Sin auth propia -> solo dev/staging, mismo criterio que el resto de este servicio.
    ports:
      - "5555:5555" # monitoreo de tareas Celery — solo dev/staging, sin auth propia

  suit-panel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        SERVICE_DIR: suit-panel
      target: runner
    restart: unless-stopped
    depends_on:
      - suit-orquestador
      - suit-conciliacion
    env_file: ../suit-panel/.env
    environment:
      CONCILIACION_API_URL: http://suit-conciliacion:8000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true" # Auth.js/NextAuth v5 detras de Docker/proxy: sin esto rechaza el host con UntrustedHost
    ports:
      - "3000:3000"

  suit-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        SERVICE_DIR: suit-portal
        # NEXT_PUBLIC_* deben pasarse como build arg (no alcanza con
        # `environment:` en runtime) — Next.js los inlinea en el bundle del
        # cliente durante `npm run build`, y el .env real esta excluido del
        # build context (.dockerignore). Mantener sincronizado con
        # suit-portal/.env.
        NEXT_PUBLIC_CONCILIACION_DOCS_URL: http://localhost:8002/api/docs/
        NEXT_PUBLIC_ORQUESTADOR_PUBLIC_URL: http://localhost:8001
      target: runner
    restart: unless-stopped
    depends_on:
      - suit-orquestador
    env_file: ../suit-portal/.env
    environment:
      ORQUESTADOR_API_URL: http://suit-orquestador:8000
      NEXT_PUBLIC_CONCILIACION_DOCS_URL: http://localhost:8002/api/docs/
    ports:
      - "3001:3000"

volumes:
  postgres_orquestador_data:
  postgres_conciliacion_data:
  rabbitmq_data:
